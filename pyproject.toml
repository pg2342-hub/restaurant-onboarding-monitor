[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "restaurant-onboarding-monitor"
version = "0.1.0"
description = "Maps a restaurant group's POS, invoice and recipe exports into one item catalog, says which locations are ready to go live, then watches the live data for problems."
requires-python = ">=3.10"
dependencies = ["anthropic>=2.0", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = ["onboarding", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 170
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["onboarding", "eval"]
