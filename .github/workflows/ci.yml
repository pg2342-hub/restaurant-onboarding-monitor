name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - name: Tests (the recorded live Claude run is graded once it exists)
        run: pytest -q
      - name: Replay everything and check the committed results are current
        run: |
          python scripts/run_all.py
          git diff --exit-code reports/results.json || { echo "results.json is stale; run scripts/run_all.py and docs/build_page.py"; exit 1; }
